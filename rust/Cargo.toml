[workspace]
resolver = "3"
members = ["mdm-android", "mdm-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
# Speed first: checksum hashing of multi-GB files runs in Rust.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
