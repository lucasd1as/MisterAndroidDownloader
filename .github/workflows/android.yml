name: Android

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attaching the APK to a release (tags only)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Rust tests (engine + queue against the lab server)
        working-directory: rust
        run: cargo test -p mdm-android

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MDM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "MDM_KEYSTORE_PASSWORD=${{ secrets.MDM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MDM_KEY_ALIAS=${{ secrets.MDM_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MDM_KEY_PASSWORD=${{ secrets.MDM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint, release APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MisterAndroidDownloader-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
